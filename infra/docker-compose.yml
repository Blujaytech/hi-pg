services:
  postgres:
    image: postgres:16-alpine
    container_name: pgplatform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pgplatform
      POSTGRES_USER: pgplatform
      POSTGRES_PASSWORD: pgplatform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgplatform -d pgplatform"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    container_name: pgplatform-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pgplatform
      SPRING_DATASOURCE_USERNAME: pgplatform
      SPRING_DATASOURCE_PASSWORD: pgplatform
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    profiles:
      - full

volumes:
  postgres-data:
