name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test (Testcontainers needs Docker, available on GitHub-hosted runners)
        working-directory: backend
        run: mvn -B verify
      - name: Report backend test failures
        if: failure()
        working-directory: backend
        shell: bash
        run: |
          for report in target/surefire-reports/*.txt; do
            [ -f "$report" ] || continue
            if grep -Eq 'Failures: [1-9]|Errors: [1-9]' "$report"; then
              details="$(tail -n 80 "$report")"
              details="${details//'%'/'%25'}"
              details="${details//$'\r'/'%0D'}"
              details="${details//$'\n'/'%0A'}"
              echo "::error title=$(basename "$report")::$details"
            fi
          done

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm install
          npm run lint
          npm run build

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          # Keep CI aligned with pubspec.lock (Dart >=3.11 / Flutter >=3.38.4).
          # 3.41.4 is the exact stable toolchain used for the release checks.
          flutter-version: '3.41.4'
          channel: stable
      - working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
