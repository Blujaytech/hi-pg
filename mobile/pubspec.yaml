name: pg_platform_mobile
description: PG Management & Discovery Platform - Owner + Student app (Flutter, single codebase, two role-gated flows).
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  dio: ^5.4.3

  # Routing
  go_router: ^14.2.0

  # State management (kept deliberately simple/vanilla for a two-dev team;
  # see docs/decisions.md if this needs to become riverpod/bloc later)
  provider: ^6.1.2

  # Secure JWT storage
  flutter_secure_storage: ^9.2.2

  # Optional customer authentication; owner email/password remains separate.
  google_sign_in: ^7.2.0

  # Firebase provides production phone OTP and device push tokens. The app
  # still exchanges Firebase identity for the backend's own role-scoped JWT.
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0

  # Env config (--dart-define based, see core/env.dart)
  # (no package needed -- String.fromEnvironment is built in)

  intl: ^0.19.0

  # Native Google Maps view for student property details. The Android and
  # platform-interface packages are listed only so main.dart can pick the
  # map's renderer and view mode (see _configureMaps there).
  google_maps_flutter: ^2.18.0
  google_maps_flutter_android: ^2.19.10
  google_maps_flutter_platform_interface: ^2.16.1
  # Device location for "PGs near me" on the search screen.
  geolocator: ^14.0.2
  url_launcher: ^6.3.0
  file_picker: ^8.1.7
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt

  # Brand typeface (SIL Open Font License, registered with LicenseRegistry in
  # main.dart). Bundled rather than fetched at runtime so first launch and
  # offline use render identically.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
