# Render Blueprint for the Spring Boot backend and its Postgres database.
# The service is intentionally defined at the repository root because this is
# a monorepo; Docker builds only from backend/.
services:
  - type: web
    name: pg-platform-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: "10000"
      - key: DB_HOST
        fromDatabase:
          name: pg-platform-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pg-platform-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: pg-platform-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: pg-platform-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pg-platform-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      # OAuth client IDs are public identifiers (the Android app contains the
      # same value). Keeping it in the Blueprint prevents a deployment where
      # the Google button is visible but the backend cannot verify its token.
      - key: GOOGLE_OAUTH_CLIENT_ID
        value: 83954662324-8tsednfctojp1stj3o7rc7fvs02m1lds.apps.googleusercontent.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Private Cloudflare R2 bucket used for owner/student documents. Keep
      # credentials in Render; never commit their values to this Blueprint.
      - key: S3_ENABLED
        value: "true"
      - key: S3_ENDPOINT
        value: https://1f5240818c712202da2c5c3745d1f51f.r2.cloudflarestorage.com
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: hi-pg-kyc-private
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_PATH_STYLE_ACCESS
        value: "false"

databases:
  - name: pg-platform-db
    plan: free
    region: singapore
    databaseName: pgplatform
    user: pgplatform
