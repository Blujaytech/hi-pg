spring:
  application:
    name: pg-platform-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      # Matches the 10 MB ceiling DocumentService/OwnerKycService enforce. Spring's
      # 1 MB default rejected anything larger at the servlet layer first, so the
      # documented limit was never the one callers actually hit.
      max-file-size: 10MB
      max-request-size: 12MB

server:
  address: 0.0.0.0
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  otp:
    ttl-minutes: 5
    max-attempts-per-hour: 5
  google:
    oauth-client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    api-base-url: ${RAZORPAY_API_BASE_URL:https://api.razorpay.com}
  storage:
    s3:
      enabled: ${S3_ENABLED:false}
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:ap-south-1}
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style-access: ${S3_PATH_STYLE_ACCESS:false}
  booking:
    hold-expiry-check-ms: 60000
    stay-transition-cron: ${STAY_TRANSITION_CRON:0 5 * * * *}
  billing:
    reminder-cron: ${BILLING_REMINDER_CRON:0 0 9 * * *}
  rate-limit:
    auth:
      window-seconds: 60
      max-requests: 20
