# Production settings activated with SPRING_PROFILES_ACTIVE=prod. The Render Blueprint supplies
# DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD from managed Postgres. Deployments using an
# existing database can continue to override these with SPRING_DATASOURCE_* environment vars.

server:
  # Trust the reverse proxy's X-Forwarded-* headers for building correct redirect URLs / scheme
  # detection. Only correct when a real reverse proxy sits in front of this app and strips any
  # client-supplied X-Forwarded-* before setting its own -- same assumption RateLimitFilter
  # already documents for its own X-Forwarded-For read (see docs/security.md). Do not enable
  # this if the backend is ever exposed directly with no proxy in front of it.
  forward-headers-strategy: framework

spring:
  # Render's free web instances have very limited CPU. Eagerly constructing
  # every controller/service/repository kept the process from opening its HTTP
  # port before Render's port-scan deadline. Production traffic can initialize
  # feature beans on first use; the health endpoint and web server remain
  # available as soon as the core application context is ready.
  main:
    lazy-initialization: true
  datasource:
    # Render exposes these values directly from a managed Postgres resource in
    # render.yaml. Explicit SPRING_DATASOURCE_* variables still override these
    # properties when deploying against an existing/external database.
    url: '${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}}'
    username: '${SPRING_DATASOURCE_USERNAME:${DB_USER}}'
    password: '${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}'
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
  data:
    jpa:
      # Repository query parsing is one of the most CPU-intensive startup
      # phases. Build repository proxies only when an API first needs them.
      repositories:
        bootstrap-mode: lazy
  jpa:
    # Flyway owns the production schema and validates migration checksums on
    # every boot. Repeating Hibernate's complete schema validation delays port
    # binding considerably on a small instance.
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  jwt:
    # No dev-only fallback here (unlike application.yml's ${JWT_SECRET:dev-only-...}) --
    # deliberately fails fast at startup if JWT_SECRET isn't set, rather than silently signing
    # production tokens with a secret that's checked into git and known to anyone who's read it.
    secret: ${JWT_SECRET}
  google:
    # OAuth client IDs are public identifiers. Use the Hi PG Web client ID as
    # a deploy-safe default while still allowing an environment override.
    # This keeps an existing manually-created Render service from failing
    # before a Blueprint sync has added the new variable.
    oauth-client-id: ${GOOGLE_OAUTH_CLIENT_ID:83954662324-8tsednfctojp1stj3o7rc7fvs02m1lds.apps.googleusercontent.com}

logging:
  level:
    root: INFO
    com.pgplatform: INFO

management:
  endpoint:
    health:
      show-details: never
