# Production settings activated with SPRING_PROFILES_ACTIVE=prod. The Render Blueprint supplies
# DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD from managed Postgres. Deployments using an
# existing database can continue to override these with SPRING_DATASOURCE_* environment vars.

server:
  # Trust the reverse proxy's X-Forwarded-* headers for building correct redirect URLs / scheme
  # detection. Only correct when a real reverse proxy sits in front of this app and strips any
  # client-supplied X-Forwarded-* before setting its own -- same assumption RateLimitFilter
  # already documents for its own X-Forwarded-For read (see docs/security.md). Do not enable
  # this if the backend is ever exposed directly with no proxy in front of it.
  forward-headers-strategy: framework

spring:
  datasource:
    # Render exposes these values directly from a managed Postgres resource in
    # render.yaml. Explicit SPRING_DATASOURCE_* variables still override these
    # properties when deploying against an existing/external database.
    url: '${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}}'
    username: '${SPRING_DATASOURCE_USERNAME:${DB_USER}}'
    password: '${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}'
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}

app:
  jwt:
    # No dev-only fallback here (unlike application.yml's ${JWT_SECRET:dev-only-...}) --
    # deliberately fails fast at startup if JWT_SECRET isn't set, rather than silently signing
    # production tokens with a secret that's checked into git and known to anyone who's read it.
    secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    com.pgplatform: INFO

management:
  endpoint:
    health:
      show-details: never
